# Dev stack — local tooling (Adminer, Mailhog, MinIO)
# From monorepo root: docker compose -f backend/docker/docker-compose.dev.yml up -d
name: ec-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: electronics
      POSTGRES_PASSWORD: electronics
      POSTGRES_DB: electronics_cart
    ports:
      - "5433:5432"
    volumes:
      - ec_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electronics -d electronics_cart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - ec_dev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ec_dev_minio:/data

volumes:
  ec_dev_pg:
  ec_dev_redis:
  ec_dev_minio:
