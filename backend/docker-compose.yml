services:
  postgres:
    image: postgres:16-alpine
    container_name: ec_backend_pg
    environment:
      POSTGRES_USER: electronics
      POSTGRES_PASSWORD: electronics
      POSTGRES_DB: electronics_cart
    ports:
      - "5433:5432"
    volumes:
      - ec_backend_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electronics -d electronics_cart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ec_backend_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: ec_backend_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ec_backend_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: ec_backend_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ec_backend_minio:/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ec_backend_api
    env_file:
      - .env.example
    environment:
      PORT: "3051"
      DATABASE_URL: postgresql://electronics:electronics@postgres:5432/electronics_cart
      DIRECT_URL: postgresql://electronics:electronics@postgres:5432/electronics_cart
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: electronics-cart
      S3_REGION: us-east-1
    ports:
      - "3051:3051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ec_backend_pg:
  ec_backend_minio:
