# Electronics Cart — production Nginx reverse proxy
# Include from /etc/nginx/nginx.conf or symlink into sites-enabled.
# TLS certs: /etc/letsencrypt/live/api.example.com/

upstream ec_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=ec_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ec_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ec_admin:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ec_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # HTTP/3 ready (requires nginx with quic module):
    # listen 443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400';

    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (app also sets Helmet)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    server_tokens off;

    client_max_body_size 25m;
    client_body_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # Brotli (requires nginx-module-brotli)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    limit_conn ec_conn 40;

    location /socket.io/ {
        proxy_pass http://ec_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/auth/ {
        limit_req zone=ec_auth burst=20 nodelay;
        proxy_pass http://ec_api;
        include /etc/nginx/snippets/ec-proxy-params.conf;
    }

    location /api/admin/ {
        limit_req zone=ec_admin burst=30 nodelay;
        # Optional: allowlist
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://ec_api;
        include /etc/nginx/snippets/ec-proxy-params.conf;
    }

    location /api/health/ {
        proxy_pass http://ec_api;
        include /etc/nginx/snippets/ec-proxy-params.conf;
        access_log off;
    }

    location /api/ {
        limit_req zone=ec_api burst=60 nodelay;
        proxy_pass http://ec_api;
        include /etc/nginx/snippets/ec-proxy-params.conf;
        # Short cache for public catalog GETs (optional — disable if dynamic)
        # proxy_cache_valid 200 30s;
    }

    location / {
        return 404;
    }
}
