name: Backend CI / CD

on:
  push:
    paths:
      - "backend/**"
      - "database/schema.prisma"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/schema.prisma"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after green build"
        required: false
        default: "false"

jobs:
  build-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate (locked schema)
        run: pnpm exec prisma validate --schema ../database/schema.prisma

      - name: Prisma generate
        run: pnpm exec prisma generate --schema ../database/schema.prisma

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test --passWithNoTests

      - name: Build
        run: pnpm run build

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/docker/Dockerfile -t ec-api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f backend/docker/Dockerfile.worker -t ec-worker:${{ github.sha }} .

  deploy:
    name: Deploy (manual / dispatch)
    needs: [build-test, docker]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.PROD_APP_PATH }}
            git fetch --depth=1 origin ${{ github.sha }}
            git checkout ${{ github.sha }}
            cd backend
            ./deployment/pre-deploy.sh
            ./deployment/deploy.sh || {
              echo "deploy failed — invoke rollback.sh manually"
              exit 1
            }
            ./deployment/health-check.sh
